[package]
name = "openems-py"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Python bindings for the openEMS FDTD solver"

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
openems-core = { path = "../rust" }

[lib]
name = "openems_py"
crate-type = ["cdylib"]

